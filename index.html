<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Filmoteka</title>
    <link rel="stylesheet" href="dist/output.css">
    <script src="js/main.js" defer></script>
</head>

<body class="bg-slate-100 text-slate-800 ">

    <main class="mx-auto max-w-2xl space-y-6 p-4">

        <h1 class="text-3xl font-bold">
            Filmoteka
        </h1>

        <div id="hint" class="flex items-center gap-3 rounded bg-amber-100 p-3 text-sm">
            <p class="flex-1">Savjet: tipka Esc u polju za pretragu briše upisani pojam</p>
            <button id="hint-close" type="button" class="rounded px-2 py-1 hover:bg-amber-200">Zatvori</button>
        </div>

        <form id="add-form" class="space-y-3 rounded bg-white p-4 shadow">
            <h2 class="text-lg font-semibold">Dodaj film</h2>
            <div class="flex gap-2">
                <label for="title" class="block text-sm font-medium">Naziv</label>
                <input id="title" name="title" type="text" class="w-full rounded border-slate-300 px-2 py1">
                <p id="title-error" class="text-sm text-red-700"></p>
            </div>
            <div class="flex gap-2">
                <div class="flex-1">
                    <label for="year" class="block text-sm font-medium">Žanr</label>
                    <select id="genre" name="genre" class="w-full rounded border-slate-300 px-2 py1">
                        <option value="">Odaberi žanr</option>
                        <option value="akcija">Animirani</option>
                        <option value="komedija">Komedija</option>
                        <option value="drama">Drama</option>
                        <option value="horor">Dokumentarni</option>
                    </select>
                    <p id="genre-error" class="text-sm text-red-700"></p>
                </div>
                <div class="flex-1">
                    <label for="minutes" class="block text-sm font-medium">Trajanje (min)</label>
                    <input id="minutes" name="minutes" type="number" class="w-full rounded border-slate-300 px-2 py1">
                    <p id="minutes-error" class="text-sm text-red-700"></p>
                </div>
            </div>
            <label for="watched" class="flex items-center gap-2">
                <input id="watched" name="watched" type="checkbox" class="rounded border-slate-300">
                <span class="text-sm font-medium">Pregledano</span>
            </label>
            <button type="submit" class="rounded bg-indigo-600 px-4 py-2 text-sm font-medium text-white hover:bg-indigo-700">Dodaj</button>
        </form>
        <p id="message" aria-live="polite"class="text-sm text-green-700"></p>


        <p id="counter" class="text-sm text-slate-600"></p>

        <ul id="list" class="space-y-2">

        </ul>
        <p id="empty" hidden class="text-slate-500">Nema filmova koji odgovaraju odabiru</p>
    </main>

</body>

</html>
